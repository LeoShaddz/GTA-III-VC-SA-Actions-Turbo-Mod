name: Build BikeTurbo and MeleeTurbo ASIs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile BikeTurbo (SA), MeleeTurboVC and MeleeTurboIII
        shell: pwsh
        run: |
          foreach ($name in @("BikeTurbo", "MeleeTurboVC", "MeleeTurboIII")) {
            $src = Get-ChildItem -Recurse -Filter "$name.cpp" | Select-Object -First 1
            if (-not $src) { throw "$name.cpp nao encontrado" }
            Push-Location $src.DirectoryName
            cl /nologo /LD /O2 /MT /EHsc /D_CRT_SECURE_NO_WARNINGS "$name.cpp" "/Fe:$name.asi" /link user32.lib kernel32.lib
            if ($LASTEXITCODE -ne 0) { throw "Falha na compilacao: $name" }
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BikeTurbo-MeleeTurbo
          path: |
            **/BikeTurbo.asi
            **/MeleeTurboVC.asi
            **/MeleeTurboIII.asi
            **/BikeTurbo.ini
            **/MeleeTurboVC.ini
            **/MeleeTurboIII.ini

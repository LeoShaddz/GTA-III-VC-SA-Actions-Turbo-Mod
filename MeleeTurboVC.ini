[MeleeTurbo]
; 1 = ativo, 0 = desativado
Enable = 1

; Texto que liga/desliga o turbo quando digitado durante o jogo (so letras A-Z).
; Nao usa o sistema de cheats do jogo, entao nao conta como cheat.
Code = MELEETURBO

; Mensagens que aparecem na caixa de aviso do jogo (a mesma dos cheats, com o mesmo som)
TextOn  = Melee Turbo On
TextOff = Melee Turbo Off

; Velocidade dos "toques": quantos frames do jogo o botao fica apertado e depois solto.
; 1 = mais rapido, 2 = mais lento, 3 = ainda mais lento...
TapFrames = 1

; 1 = o turbo ja comeca ligado ao iniciar o jogo (a opcao do menu tambem comeca em Yes).
; Padrao 0 (No). Se SaveChoice = 1, a ultima escolha salva vale mais que este valor.
StartEnabled = 0

; Botao de ataque do jogo: Circle (padrao), Cross, Square, Triangle, R1, L1, R2 ou L2.
; So mude se o seu esquema de controle usar outro botao para atacar.
; O turbo so age a pe, com o punho ou uma arma branca na mao (ate a katana), com o controle do personagem
; (nada de cutscenes, lojas ou menus). Nunca age com arma de fogo, motosserra ou dentro de veiculo.
MeleeFireButton = Circle

; ---------------------------------------------------------------------------------------------
; Opcao "Melee Turbo" no menu Controller Setup (abaixo de Mouse Settings)
; ---------------------------------------------------------------------------------------------
; 1 = esconde a opcao do menu (o menu volta a ser exatamente como o original; so o codigo digitado
; liga/desliga). 0 = mostra a opcao (padrao).
; Com a opcao visivel: Enter, A, clique, setas ou direcional alternam entre Yes e No, e
; "Restore Defaults" volta a opcao para No.
HideMenuOption = 0

; 1 = a roda do mouse alterna Yes / No quando a opcao esta selecionada no menu. 0 = desativa.
MouseWheel = 1

; 1 = lembra a escolha (Yes/No) ao fechar o jogo, em MeleeTurboVC.sav ao lado do .asi. A escolha salva vale
; mais que StartEnabled. 0 = sempre comeca como StartEnabled manda.
SaveChoice = 1

; Textos da opcao. O formato diz como a linha aparece: {text} = nome, {value} = Yes/No.
; Pode ser escrito em UTF-8 (salve o arquivo como UTF-8), por exemplo: MenuYes = Da / MenuNo = Ne / š
; Obs.: a fonte do Vice City nao tem as letras acentuadas do San Andreas; letras como a, e, c com acento aparecem
; sem acento. O s e o S com caron (š Š) funcionam (codigos abaixo).
MenuText   = Melee Turbo
MenuYes    = Yes
MenuNo     = No
MenuFormat = {text}: {value}

; Codigos da fonte do jogo para š e Š (padrao 0x9A e 0x8A). So mude se a sua fonte usar outros.
SmallSCode   = 0x9A
CapitalSCode = 0x8A

; Acao interna da nova linha. 100 = acao sem efeito no jogo (a linha so alterna Yes/No, sem recarregar a tela
; nem piscar a moldura). 4 = a mesma de "Mouse Settings" (recarrega a tela ao clicar). Normalmente nao precisa mudar.
MenuAction = 100

; So usado se alguma linha do menu tiver posicao Y fixa (no menu original as linhas se ajustam sozinhas:
; Restore Defaults e Back descem uma linha com o mesmo espacamento). 30 = mesmo passo das outras telas.
MenuRowStep = 30

; 1 = gera MeleeTurboVC.log ao lado do .asi (diagnostico; lista as telas do menu e o que foi alterado)
Log = 0

; Se a sua fonte do jogo coloca um caractere em outro byte, informe aqui: caractere = byte do jogo
; (ou U+0161 = 154). Exemplo: o s com caron no byte 154.
[CharMap]
;š = 154

[BikeTurbo]
; 1 = ativo, 0 = desativado
Enable = 1

; Texto que liga/desliga o turbo quando digitado durante o jogo (so letras A-Z)
Code = BIKETURBO

; Mensagens que aparecem na caixa de aviso do jogo (a mesma dos cheats, com o mesmo som)
TextOn  = Bike Turbo On
TextOff = Bike Turbo Off

; Velocidade dos "toques": quantos frames do jogo o botao fica apertado e depois solto.
; 1 = mais rapido (cerca de 15 toques por segundo a 30 FPS), 2 = cerca de 7, 3 = cerca de 5...
; Se a bicicleta nao acelerar, tente 2 ou 3 (alguns jogos precisam de toques mais lentos).
TapFrames = 1

; 1 = o turbo ja comeca ligado ao iniciar o jogo (a opcao do menu tambem comeca em Yes)
StartEnabled = 0

; 1 = o turbo tambem vale para SOCOS e ARMAS BRANCAS (so a pe, com o punho ou uma arma branca na mao): segurar o ataque
; (B no controle / botao do mouse) repete o golpe padrao, e segurar o golpe alternativo (mirar com RB / botao direito do mouse e
; apertar Y / F) repete o golpe alternativo. So age com o turbo ligado (codigo digitado ou opcao do menu = Yes), nunca com arma de
; fogo na mao, dentro de veiculo, em menus, lojas ou cutscenes. 0 = desligado (padrao).
MeleeTurbo = 0

; 1 = o turbo tambem vale na ACADEMIA, so quando o jogador esta num aparelho (detectado pelas animacoes do pacote "gymnasium"):
;   - pesos pequenos e grandes: segurar A ou B (teclado: Espaco ou botao esquerdo do mouse) alterna os dois botoes sozinho;
;   - esteira e bicicleta ergometrica: segurar A (teclado: Espaco) repete o toque.
; Fora dos aparelhos, nao faz nada. So age com o turbo ligado (codigo digitado ou opcao do menu = Yes). 0 = desligado (padrao).
; Com Log = 1, o BikeTurbo.log mostra as animacoes da academia detectadas (linhas "GymTurbo").
GymTurbo = 0

; Botao de ataque do jogo para o turbo de socos: Circle (B no controle Xbox; padrao), Cross, Square, Triangle, R1, L1, R2 ou L2.
; So mude se o seu esquema de controle usar outro botao para atacar.
MeleeFireButton = Circle

; ---------------------------------------------------------------------------------------------
; Opcao "Bike Turbo" no menu Controller Setup (abaixo de Mouse Settings)
; ---------------------------------------------------------------------------------------------
; 1 = esconde a opcao do menu (o menu volta a ser exatamente como o original; so o codigo digitado
; liga/desliga). 0 = mostra a opcao (padrao).
; Com a opcao visivel: Enter, A, clique, setas ou direcional alternam entre Yes e No, e
; "Restore Defaults" (confirmando no Yes) volta a opcao para No.
HideMenuOption = 0

; 1 = a roda do mouse alterna Yes / No quando a opcao esta selecionada no menu. 0 = desativa.
MouseWheel = 1

; 1 = lembra a escolha (Yes/No) ao fechar o jogo, em BikeTurbo.sav ao lado do .asi. A escolha salva vale
; mais que StartEnabled. 0 = sempre comeca como StartEnabled manda.
SaveChoice = 1

; Textos da opcao. O formato diz como a linha aparece: {text} = nome, {value} = Yes/No.
; Pode ser escrito em UTF-8 (salve o arquivo como UTF-8), por exemplo: MenuYes = Da / MenuNo = Ne / š
MenuText   = Bike Turbo
MenuYes    = Yes
MenuNo     = No
MenuFormat = {text}: {value}

; Pagina de codigo usada para converter UTF-8 em bytes do jogo (1252 = Europa Ocidental,
; 1250 = Europa Central; as duas tem o š no mesmo byte, 0x9A).
CharCodePage = 1252

; Acao interna da nova linha. 254 = sem efeito para o jogo: Enter / A / clique / setas / direcional so alternam
; Yes e No, sem recarregar a tela. Se a linha nao aparecer, o mod troca sozinho para 5 (a de "Redefine Controls",
; que o jogo sempre desenha) depois de 1 segundo.
MenuAction = 254

; Espaco automatico entre as linhas do menu, em unidades do jogo (30 = os 72 px do seu print a 1080p).
; So mude se Restore Defaults ficar mais perto ou mais longe de Back do que no menu original.
MenuRowStep = 30

; 1 = gera BikeTurbo.log ao lado do .asi (diagnostico; lista as telas do menu e o que foi alterado)
Log = 0

; Se a sua fonte do jogo coloca um caractere em outro byte, informe aqui: caractere = byte do jogo
; (ou U+0161 = 154). Exemplo: o s com caron no byte 154.
[CharMap]
;š = 154
